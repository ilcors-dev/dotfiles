modelRoles:
  advisor: opencode-go/muse-spark-1.3-contributor
  default: opencode-go/muse-spark-1.3-contributor
composer:
  shape: pi
  tokenRate: false
theme:
  dark: titanium
  light: light
setupVersion: 2
cycleOrder:
  - default
hideThinkingBlock: false
display:
  hideToolActivity: false
dev:
  autoqaConsent: granted
defaultThinkingLevel: auto
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
task:
  maxEffort: high
symbolPreset: nerd
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - subagents
    - git
    - pr
  rightSegments:
    - session_name
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
  transparent: false
  compactThinkingLevel: true
textVerbosity: low
personality: pragmatic
advisor:
  enabled: true
spelling:
  autocorrect: false
autoResume: true
startup:
  quiet: true
edit:
  mode: hashline
readLineNumbers: true
tui:
  vimMode: true
  vimModeDisplay: text
modelPresets:
  personal:
    modelRoles:
      advisor: opencode-go/muse-spark-1.3-contributor
      default: opencode-go/muse-spark-1.3-contributor
    defaultThinkingLevel: auto
  work:
    modelRoles:
      advisor: openai-codex/gpt-6.1-sol:auto
      default: anthropic/claude-opus-5-5
      commit: openai-codex/gpt-6-luna:auto
      task: anthropic/claude-sonnet-5-5:auto
      tiny: openai-codex/gpt-6-luna:auto
      plan: anthropic/claude-opus-5-5:auto
    defaultThinkingLevel: auto
modelRoleStorage: global
completion:
  notify: "on"
ask:
  notify: "on"
retry:
  fallbackChains:
    advisor:
      - anthropic/claude-opus-5-5
    commit:
      - anthropic/claude-sonnet-5-5
    tiny:
      - anthropic/claude-sonnet-5-5