modelRoles:
  task: anthropic/claude-sonnet-5-5:auto
  plan: anthropic/claude-fable-5-1:auto
  slow: openai-codex/gpt-6.1-sol:auto
  designer: anthropic/claude-fable-5-1:auto
  commit: openai-codex/gpt-6-luna:auto
  tiny: openai-codex/gpt-5.6-luna:auto
  vision: anthropic/claude-opus-5:auto
  advisor: anthropic/claude-opus-5-5:auto
  REVIEWER: anthropic/claude-fable-5-1:auto
  smol: anthropic/claude-sonnet-5-5:auto
  default: anthropic/claude-opus-5-5
composer:
  shape: pi
  tokenRate: false
theme:
  dark: titanium
  light: light
setupVersion: 2
cycleOrder:
  - default
hideThinkingBlock: false
display:
  hideToolActivity: false
dev:
  autoqaConsent: granted
retry:
  fallbackChains:
    plan:
      - openai-codex/gpt-5.6-sol
    slow:
      - anthropic/claude-fable-5-1
    smol:
      - openai-codex/gpt-5.6-terra
    default:
      - openai-codex/gpt-5.6-terra
    REVIEWER:
      - openai-codex/gpt-6.1-sol
    advisor:
      - openai-codex/gpt-5.6-sol
      - anthropic/claude-fable-5-1
    task:
      - openai-codex/gpt-5.6-terra
defaultThinkingLevel: auto
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
task:
  maxEffort: high
symbolPreset: nerd
statusLine:
  preset: custom
  leftSegments: [vim, model, mode, subagents, git, pr]
  rightSegments: [session_name, context_pct]
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
  transparent: false
  compactThinkingLevel: true
textVerbosity: low
personality: pragmatic
advisor:
  enabled: true
spelling:
  autocorrect: false
autoResume: true
startup:
  quiet: true
edit:
  mode: hashline
readLineNumbers: true